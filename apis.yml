aid: constellation-space
name: Constellation Space
description: >-
  Constellation Space Corp (ConstellationOS) is the ML-native operations
  platform for satellite fleets, founded in 2025 in Seattle and backed by Y
  Combinator. Operators connect ground telemetry through one API and one schema,
  run machine-learning link forecasts on live fleet context (SNR and link fade,
  traffic, weather, jamming, and conjunction), and act under operator policy with
  automated routing, stream isolation, and failover. The ConstellationOS HTTP
  API exposes fleet topology reads, telemetry ingestion, and predictions, secured
  with scoped bearer tokens, alongside a web console, a fleet agent CLI, and a
  public status page.
